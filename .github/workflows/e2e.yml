name: Web E2E

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          docs_only=false
          run_e2e=true
          changed_files=()

          if [[ -n "$PR_BASE_SHA" && -n "$PR_MERGE_SHA" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA" "$PR_MERGE_SHA")
            if ((${#changed_files[@]} > 0)); then
              docs_only=true
              for file in "${changed_files[@]}"; do
                if [[ ! "$file" =~ (^|/)([^/]+\.(md|markdown|mdx)|LICENSE(\.[^/]*)?)$ ]]; then
                  docs_only=false
                  break
                fi
              done
              if [[ "$docs_only" == "true" ]]; then
                run_e2e=false
              fi
            fi
          fi

          {
            echo "### Change classifier"
            echo "- Documentation-only: $docs_only"
            echo "- Run web E2E: $run_e2e"
            if ((${#changed_files[@]} > 0)); then
              echo "- Changed files:"
              printf '  - `%s`\n' "${changed_files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"

  web-e2e-shard:
    name: Web E2E (${{ matrix.shard }}/2)
    needs: classify
    if: needs.classify.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
      PLAYWRIGHT_MAX_FAILURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start timing
        run: echo "E2E_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Record setup duration
        run: |
          setup_end=$(date +%s)
          echo "E2E_SETUP_DURATION=$((setup_end - E2E_JOB_START))" >> "$GITHUB_ENV"

      - name: Run web E2E shard
        env:
          ZAI_DATA_DIR: ${{ runner.temp }}/zai-e2e-${{ matrix.shard }}
        run: |
          test_start=$(date +%s)
          set +e
          pnpm test:e2e:web --shard="${{ matrix.shard }}/2"
          test_status=$?
          set -e
          test_end=$(date +%s)
          echo "E2E_TEST_DURATION=$((test_end - test_start))" >> "$GITHUB_ENV"
          echo "E2E_SHARD_DURATION=$((test_end - E2E_JOB_START))" >> "$GITHUB_ENV"
          exit "$test_status"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-failure-artifacts-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Write shard summary
        if: always()
        run: |
          total_end=$(date +%s)
          {
            echo "### Web E2E shard ${{ matrix.shard }}/2"
            echo "- Setup duration: ${E2E_SETUP_DURATION:-unavailable}s"
            echo "- Test duration: ${E2E_TEST_DURATION:-unavailable}s"
            echo "- Shard duration: ${E2E_SHARD_DURATION:-unavailable}s"
            echo "- Total duration: $((total_end - E2E_JOB_START))s"
            echo "- Failure mode: stop after first failure"
          } >> "$GITHUB_STEP_SUMMARY"

  web-e2e:
    name: Web E2E
    if: always()
    needs:
      - classify
      - web-e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Write aggregate summary
        run: |
          {
            echo "### Web E2E"
            echo "- Change classifier: ${{ needs.classify.result }}"
            echo "- Shards: ${{ needs.web-e2e-shard.result }}"
            echo "- Documentation-only: ${{ needs.classify.outputs.docs_only }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate aggregate result
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          SHARD_RESULT: ${{ needs.web-e2e-shard.result }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "Change classifier did not complete successfully."
            exit 1
          fi
          if [[ "$DOCS_ONLY" == "true" && "$SHARD_RESULT" == "skipped" ]]; then
            echo "Documentation-only change: web E2E shards were skipped."
            exit 0
          fi
          if [[ "$SHARD_RESULT" == "success" ]]; then
            echo "Both web E2E shards passed."
            exit 0
          fi
          echo "Web E2E shards did not pass."
          exit 1
