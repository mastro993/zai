name: Release

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - nightly
          - stable
        default: nightly

permissions:
  actions: read
  contents: read

# One release may mutate main at a time. New runs wait instead of cancelling active work.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Scheduled Nightlies stop early when only release-bot commits followed latest Nightly.
  detect-changes:
    name: Detect releasable changes
    permissions:
      contents: read
    uses: ./.github/workflows/release-detect-changes.yml
    with:
      force: ${{ github.event_name == 'workflow_dispatch' }}

  # Validate source, run all checks, commit version, push tag, and create draft release.
  prepare:
    name: Prepare release
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    permissions:
      contents: write
      pages: read
    uses: ./.github/workflows/release-prepare.yml
    secrets: inherit
    with:
      channel: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel }}
      source_sha: ${{ github.sha }}

  # Build identical signed artifact sets for Stable and Nightly channels.
  build:
    name: Build release artifacts
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/release-build-artifacts.yml
    secrets: inherit
    with:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      version: ${{ needs.prepare.outputs.version }}
      package_version: ${{ needs.prepare.outputs.package_version }}

  # Attach only complete verified matrix output, then publish draft GitHub Release.
  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      release_id: ${{ needs.prepare.outputs.release_id }}
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}

  # Rebuild both rolling channels and atomically deploy updater manifests to Pages.
  updater-manifests:
    name: Publish updater manifests
    needs:
      - prepare
      - publish
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-updater-manifests.yml
    with:
      channel: ${{ needs.prepare.outputs.channel }}
      tag: ${{ needs.prepare.outputs.tag }}
      use_workflow_artifacts: true

  # Build/publication failure removes only this run's draft and tag; main stays immutable.
  cleanup:
    name: Clean failed draft release
    needs:
      - prepare
      - build
      - publish
      - updater-manifests
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result != 'success' || needs.publish.result != 'success')
    permissions:
      contents: write
    uses: ./.github/workflows/release-cleanup.yml
    with:
      release_id: ${{ needs.prepare.outputs.release_id }}
      tag: ${{ needs.prepare.outputs.tag }}
