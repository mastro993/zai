name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Stable and Nightly plans share one version sequence and must never mutate main concurrently.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Stable release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      package_version: ${{ steps.compute.outputs.package_version }}
      tag: ${{ steps.compute.outputs.tag }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      # Full history and tags let the entry workflow compute every immutable release input.
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      # Release tooling runs on the repository-supported Node.js version.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Stable policy stays at the entry point; shared workflows receive concrete values.
      - id: compute
        name: Compute Stable release
        env:
          RELEASE_CHANNEL: stable
        run: node scripts/release-version.mjs github-output

  prepare:
    name: Prepare Stable release
    needs: plan
    permissions:
      contents: write
      pages: read
    uses: ./.github/workflows/release-prepare.yml
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.plan.outputs.version }}
      package_version: ${{ needs.plan.outputs.package_version }}
      tag: ${{ needs.plan.outputs.tag }}
      previous_tag: ${{ needs.plan.outputs.previous_tag }}
      release_title: Zai ${{ needs.plan.outputs.version }}
      prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}

  release:
    name: Release ${{ needs.plan.outputs.tag }}
    needs:
      - plan
      - prepare
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release-shared.yml
    secrets: inherit
    with:
      tag: ${{ needs.plan.outputs.tag }}
