name: Prepare release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Tested main commit to release
        required: true
        type: string
      version:
        description: Public Y.M.D.B Release Version
        required: true
        type: string
      package_version:
        description: Packed SemVer committed to manifests
        required: true
        type: string
      tag:
        description: Stable or Nightly annotated release tag
        required: true
        type: string
      previous_tag:
        description: Previous same-channel release tag for generated notes
        required: false
        type: string
        default: ""
      release_title:
        description: GitHub Release title
        required: true
        type: string
      prerelease:
        description: Whether GitHub marks the release as a prerelease
        required: true
        type: boolean

permissions:
  contents: write
  pages: read

jobs:
  preflight:
    name: Verify release prerequisites
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    steps:
      # Releases must mutate main, never a manually selected feature branch.
      - name: Require main
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Releases must run from main."
            exit 1
          }

      # Fail before committing a version when required signing material is absent.
      - name: Require signing credentials
        run: |
          set -euo pipefail
          missing=()
          for name in \
            SSH_DEPLOY_KEY \
            TAURI_SIGNING_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required release setting: %s\n' "${missing[@]}"
            exit 1
          fi

      # Manifest publication depends on atomic GitHub Actions Pages deployments.
      - name: Verify GitHub Pages configuration
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          [ "$build_type" = "workflow" ] || {
            echo "::error::GitHub Pages must use GitHub Actions deployment."
            exit 1
          }

  checks:
    name: Run release checks
    runs-on: ubuntu-latest
    steps:
      # Every check runs against immutable trigger SHA, not a moving main checkout.
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      # Native frontend and backend checks require Tauri and SQLite development libraries.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config

      # Use repository-pinned pnpm version from packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Node executes frontend checks and release tooling with dependency caching.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      # Stable Rust with lint components matches repository CI policy.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      # Shared release-check cache avoids rebuilding unchanged Rust dependencies.
      - name: Restore Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-checks
          workspaces: ". -> target"

      # Frozen install rejects lockfile drift before checks consume dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One command covers release tooling, frontend, formatting, lint, Clippy, and tests.
      - name: Run checks
        run: pnpm check

  release:
    name: Commit release version and create draft
    needs:
      - preflight
      - checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Deploy-key auth bypasses main's PR-only rules for the release version commit.
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # Node validates the precomputed plan and stamps calendar versions.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Cargo metadata regenerates and validates Cargo.lock after workspace version changes.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Reject inconsistent caller plans before mutating version files or repository state.
      - name: Validate release plan
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { packageVersionFromReleaseVersion, parseReleaseTag } from "./scripts/release-version.mjs";
          const parsed = parseReleaseTag(process.env.RELEASE_TAG);
          if (!parsed || parsed.version !== process.env.RELEASE_VERSION) throw new Error("Release tag and version differ");
          if (packageVersionFromReleaseVersion(parsed.version) !== process.env.PACKAGE_VERSION) throw new Error("Release and package versions differ");
          if (String(parsed.kind === "nightly") !== process.env.PRERELEASE) throw new Error("Release tag and prerelease state differ");
          NODE

      # Version commit and tag are pushed atomically; draft cleanup never rewrites main.
      - name: Push version commit, tag, and draft release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          [ "$(git rev-parse origin/main)" = "$SOURCE_SHA" ] || {
            echo "::error::main advanced after release checks; rerun against the new HEAD."
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

          node scripts/release-version.mjs stamp "$PACKAGE_VERSION"
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

          expected="$({ printf '%s\n' Cargo.lock Cargo.toml apps/frontend/package.json apps/tauri/tauri.conf.json package.json; } | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          [ "$actual" = "$expected" ] || {
            echo "::error::Version bump changed an unexpected file set."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          }
          # shellcheck disable=SC2016
          node --input-type=module - "$PACKAGE_VERSION" <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = process.argv[2];
          for (const file of ["package.json", "apps/frontend/package.json", "apps/tauri/tauri.conf.json"]) {
            if (JSON.parse(readFileSync(file, "utf8")).version !== expected) throw new Error(`${file} version mismatch`);
          }
          const cargo = readFileSync("Cargo.toml", "utf8");
          if (!cargo.includes(`version = "${expected}"`)) throw new Error("Cargo.toml version mismatch");
          NODE

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock Cargo.toml package.json apps/frontend/package.json apps/tauri/tauri.conf.json
          git commit -m "chore(release): $RELEASE_VERSION"
          release_sha="$(git rev-parse HEAD)"
          git tag -a "$RELEASE_TAG" "$release_sha" -m "Release $RELEASE_TAG"
          tag_object_sha="$(git rev-parse "$RELEASE_TAG")"

          git push --atomic \
            --force-with-lease="refs/heads/main:$SOURCE_SHA" \
            --force-with-lease="refs/tags/$RELEASE_TAG:" \
            origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

          release_id=""
          cleanup_draft() {
            status=$?
            trap - ERR
            set +e
            if [ -n "$release_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1
            fi
            if ! git push --force-with-lease="refs/tags/$RELEASE_TAG:$tag_object_sha" origin ":refs/tags/$RELEASE_TAG"; then
              echo "::warning::Tag cleanup skipped because $RELEASE_TAG changed."
            fi
            exit "$status"
          }
          trap cleanup_draft ERR

          notes_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$RELEASE_TAG"
            -f "target_commitish=$release_sha"
          )
          [ -z "$PREVIOUS_TAG" ] || notes_args+=(-f "previous_tag_name=$PREVIOUS_TAG")
          release_notes="$(gh api "${notes_args[@]}" --jq .body)"

          release_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=$RELEASE_TAG" \
              -f "target_commitish=$release_sha" \
              -f "name=$RELEASE_TITLE" \
              -f "body=$release_notes" \
              -F draft=true \
              -F "prerelease=$RELEASE_PRERELEASE" \
              --jq .id
          )"
          trap - ERR

          printf "### %s\nCommit: \`%s\`\n" "$RELEASE_TAG" "$release_sha" >> "$GITHUB_STEP_SUMMARY"
