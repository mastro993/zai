name: Publish updater manifests

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-updater-manifests
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy updater manifests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # Generate manifests with tooling from selected immutable release tag.
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      # Node validates tags, asset sets, and generated JSON.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Refuse drafts, malformed tags, or channel/prerelease mismatches.
      - id: release
        name: Validate selected published release
        run: |
          set -euo pipefail
          info="$(node --input-type=module - "$RELEASE_TAG" <<'NODE'
          import { packageVersionFromReleaseVersion, parseReleaseTag } from "./scripts/release-version.mjs";
          const [tag] = process.argv.slice(2);
          const parsed = parseReleaseTag(tag);
          if (!parsed) throw new Error(`Invalid release tag ${tag}`);
          console.log(`channel=${parsed.kind}`);
          console.log(`version=${parsed.version}`);
          console.log(`package_version=${packageVersionFromReleaseVersion(parsed.version)}`);
          NODE
          )"
          printf '%s\n' "$info" >> "$GITHUB_OUTPUT"

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          [ "$(jq -r .draft <<<"$release")" = "false" ] || { echo "::error::Release must be published."; exit 1; }
          expected_prerelease=false
          [ "$(grep '^channel=' <<<"$info" | cut -d= -f2)" = "stable" ] || expected_prerelease=true
          [ "$(jq -r .prerelease <<<"$release")" = "$expected_prerelease" ] || {
            echo "::error::Release prerelease state does not match its tag."
            exit 1
          }
          echo "published_at=$(jq -r .published_at <<<"$release")" >> "$GITHUB_OUTPUT"

      # Immutable published assets support both normal publication and manual recovery.
      - name: Download selected release assets
        run: gh release download "$RELEASE_TAG" --dir selected-assets

      # Complete installers are required even though manifests reference updater bundles only.
      - name: Validate selected release artifact set
        run: node scripts/release-version.mjs verify-assets "${{ steps.release.outputs.version }}" selected-assets

      # Emit one target-specific Tauri manifest for selected channel and platform.
      - name: Generate selected channel manifests
        env:
          RELEASE_PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs updater-manifests \
            "${{ steps.release.outputs.channel }}" \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.package_version }}" \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" \
            selected-assets \
            site/updater

      # Pages deployments replace whole site, so preserve other channel by rebuilding it.
      - id: other
        name: Find other channel release
        run: |
          set -euo pipefail
          if [ "${{ steps.release.outputs.channel }}" = "nightly" ]; then
            other_channel=stable
            pattern='^[0-9]{4}\.[0-9]+\.[0-9]+\.[0-9]+$'
          else
            other_channel=nightly
            pattern='^nightly-[0-9]{4}\.[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          other_tag="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft == false) | .tag_name' |
              grep -E "$pattern" |
              head -n 1 || true
          )"
          echo "channel=$other_channel" >> "$GITHUB_OUTPUT"
          echo "tag=$other_tag" >> "$GITHUB_OUTPUT"

      # Validate and download latest opposite-channel release when one exists.
      - id: other-release
        name: Validate other channel release
        if: steps.other.outputs.tag != ''
        env:
          OTHER_CHANNEL: ${{ steps.other.outputs.channel }}
          OTHER_TAG: ${{ steps.other.outputs.tag }}
        run: |
          set -euo pipefail
          info="$(node --input-type=module - "$OTHER_CHANNEL" "$OTHER_TAG" <<'NODE'
          import { packageVersionFromReleaseVersion, parseReleaseTag } from "./scripts/release-version.mjs";
          const [channel, tag] = process.argv.slice(2);
          const parsed = parseReleaseTag(tag);
          if (!parsed || parsed.kind !== channel) throw new Error(`Tag ${tag} does not identify ${channel}`);
          console.log(`version=${parsed.version}`);
          console.log(`package_version=${packageVersionFromReleaseVersion(parsed.version)}`);
          NODE
          )"
          printf '%s\n' "$info" >> "$GITHUB_OUTPUT"
          gh release download "$OTHER_TAG" --dir other-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$OTHER_TAG" --jq '"published_at=" + .published_at' >> "$GITHUB_OUTPUT"

      # Reject incomplete opposite-channel history before using it in Pages projection.
      - name: Validate other release artifact set
        if: steps.other.outputs.tag != ''
        run: node scripts/release-version.mjs verify-assets "${{ steps.other-release.outputs.version }}" other-assets

      # Regenerate opposite-channel manifests into same atomic deployment directory.
      - name: Generate other channel manifests
        if: steps.other.outputs.tag != ''
        env:
          RELEASE_PUBLISHED_AT: ${{ steps.other-release.outputs.published_at }}
          OTHER_CHANNEL: ${{ steps.other.outputs.channel }}
          OTHER_TAG: ${{ steps.other.outputs.tag }}
        run: |
          node scripts/release-version.mjs updater-manifests \
            "$OTHER_CHANNEL" \
            "${{ steps.other-release.outputs.version }}" \
            "${{ steps.other-release.outputs.package_version }}" \
            "$OTHER_TAG" \
            "$GITHUB_REPOSITORY" \
            other-assets \
            site/updater

      # Every selected channel must have exactly four complete target manifests.
      - name: Validate complete Pages projection
        run: |
          set -euo pipefail
          selected_count="$(find site/updater -type f -name "${{ steps.release.outputs.channel }}-*.json" | wc -l | tr -d ' ')"
          [ "$selected_count" = "4" ] || { echo "::error::Expected four selected-channel manifests."; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";
          for (const name of readdirSync("site/updater").filter((entry) => entry.endsWith(".json"))) {
            const manifest = JSON.parse(readFileSync(`site/updater/${name}`, "utf8"));
            const platforms = Object.values(manifest.platforms ?? {});
            if (platforms.length !== 1) throw new Error(`${name} must contain one platform`);
            const [{ url, signature }] = platforms;
            if (!url?.startsWith("https://github.com/") || !signature) throw new Error(`${name} is incomplete`);
            console.log(url);
          }
          NODE

      # HEAD requests catch broken immutable download URLs before replacing live Pages.
      - name: Verify release asset URLs
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | while IFS= read -r url; do
          import { readFileSync, readdirSync } from "node:fs";
          for (const name of readdirSync("site/updater").filter((entry) => entry.endsWith(".json"))) {
            const manifest = JSON.parse(readFileSync(`site/updater/${name}`, "utf8"));
            for (const platform of Object.values(manifest.platforms)) console.log(platform.url);
          }
          NODE
            curl --fail --silent --show-error --location --retry 3 --head --output /dev/null "$url"
          done

      # Configure canonical Pages metadata for artifact-based deployment.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Bundle complete projection so deployment changes all manifests atomically.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Publish only after every manifest and referenced release asset passes validation.
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
