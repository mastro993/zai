lefthook: node "$(git rev-parse --show-toplevel)/.agents/hooks/run-lefthook.mjs"
no_auto_install: true
output: false

ai:
  claude:
    PostToolUse: agent-fix
    Stop: agent-stop
  codex:
    PostToolUse: agent-fix
    Stop: agent-stop
  cursor:
    afterFileEdit: agent-fix
    stop: agent-stop
  copilot:
    postToolUse: agent-fix
    agentStop: agent-stop

agent-fix:
  commands:
    quality:
      run: node .agents/hooks/quality.mjs fix
      timeout: 120s
      use_stdin: true

agent-stop:
  commands:
    quality:
      run: node .agents/hooks/quality.mjs stop
      timeout: 900s
      use_stdin: true

pre-commit:
  parallel: true
  commands:
    backend-quality:
      glob: "*.rs"
      run: rustfmt --edition 2024 {staged_files} && cargo clippy --workspace --all-targets --all-features -- -D warnings
      stage_fixed: true
    frontend-quality:
      root: apps/frontend/
      glob:
        - "apps/frontend/src/*.{js,jsx,ts,tsx}"
        - "apps/frontend/src/**/*.{js,jsx,ts,tsx}"
      exclude: "apps/frontend/src/routeTree.gen.ts"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files} && pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    frontend-routes:
      glob:
        - "apps/frontend/src/routes/*"
        - "apps/frontend/src/routes/**/*"
        - "apps/frontend/src/routeTree.gen.ts"
      run: pnpm --filter frontend check:routes

pre-push:
  parallel: true
  commands:
    type-check:
      run: pnpm type-check
    frontend-lint:
      run: pnpm lint
    format-check:
      run: pnpm format:check
    backend-lint:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
