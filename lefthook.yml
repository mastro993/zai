lefthook: pnpm exec lefthook
no_auto_install: true

ai:
  claude:
    PostToolUse: agent-fix
  codex:
    PostToolUse: agent-fix
  cursor:
    afterFileEdit: agent-fix
  copilot:
    postToolUse: agent-fix

agent-fix:
  commands:
    quality:
      run: node .agents/hooks/quality.mjs fix
      timeout: 120s
      use_stdin: true

pre-commit:
  parallel: true
  commands:
    frontend-format:
      glob:
        - "apps/frontend/src/*.{ts,tsx}"
        - "apps/frontend/src/**/*.{ts,tsx}"
      run: pnpm --filter frontend format:check
    frontend-lint:
      root: apps/frontend/
      glob:
        - "apps/frontend/src/*.{ts,tsx}"
        - "apps/frontend/src/**/*.{ts,tsx}"
      run: pnpm exec oxlint {staged_files}
    frontend-routes:
      glob:
        - "apps/frontend/src/routes/*"
        - "apps/frontend/src/routes/**/*"
        - "apps/frontend/src/routeTree.gen.ts"
      run: pnpm --filter frontend check:routes
