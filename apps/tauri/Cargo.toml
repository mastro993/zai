[package]
name = "zai"
version.workspace = true
description = "Your personal finance app"
authors = ["fedemas"]
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Override workspace forbid: macOS traffic lights need objc2 FFI.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-log = "=2.9.0"
tauri-plugin-dialog = "=2.7.1"
dotenvy = { workspace = true }
zai-app = { workspace = true }
zai-core = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
chrono = { workspace = true }
tauri-plugin-process = "=2.3.1"

[dev-dependencies]
tauri = { version = "~2.11", features = ["test"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
  "std",
  "NSWindow",
  "NSView",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSAnimationContext",
] }
